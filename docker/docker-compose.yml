services:

  postgres:
    image: pgvector/pgvector:pg17

    container_name: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_document_platform

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: api

    ports:
      - "8001:8000"

    env_file:
      - ../.env.dev

    depends_on:
      - postgres

volumes:
  postgres_data: